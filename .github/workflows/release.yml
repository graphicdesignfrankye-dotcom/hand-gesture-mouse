name: Build e Release

# Compila l'app per macOS (.dmg) e Windows (.exe) a ogni tag "v*" (es. v1.0.0) e pubblica i file nella Release.
# Si puo' lanciare anche a mano da Actions > "Build e Release" > Run workflow (crea solo gli artifact, senza Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Librerie
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test della logica
        run: python tests/test_core.py
      - name: Compila il .app
        run: |
          pyinstaller --noconfirm HandGestureMouse.spec
          # firma "ad-hoc" con requisito fisso: i permessi di macOS restano validi tra una versione e l'altra
          codesign --force --sign - -r='designated => identifier "com.francesco.handgesturemouse"' "dist/Hand Gesture Mouse.app"
          codesign --verify --deep --strict "dist/Hand Gesture Mouse.app"
      - name: Crea il .dmg (finestra con sfondo e scorciatoia ad Applicazioni)
        run: ./make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Hand-Gesture-Mouse-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Librerie
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller
      - name: Test della logica e della parte Windows
        run: |
          python tests/test_core.py
          python tests/test_win.py
      - name: Compila l'.exe
        run: >
          pyinstaller --noconfirm --windowed --name "Hand Gesture Mouse" --icon icons/AppIcon.ico
          --collect-all mediapipe --collect-all pygrabber --exclude-module matplotlib
          --hidden-import pystray._win32 --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          hand_mouse_win.py
      - name: Crea lo zip
        run: Compress-Archive -Path "dist/Hand Gesture Mouse" -DestinationPath Hand-Gesture-Mouse-Windows.zip
      - name: Crea l'installatore Setup.exe (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $v = if ("${{ github.ref_name }}" -match '^v(.+)$') { $Matches[1] } else { "0.0.0" }
          & $iscc "/DAppVersion=$v" installer_win.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/Hand-Gesture-Mouse-Windows-Setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: |
            Hand-Gesture-Mouse-Windows.zip
            Hand-Gesture-Mouse-Windows-Setup.exe

  release:
    # pubblica anche se una delle due piattaforme fallisce: il file riuscito resta scaricabile
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && (needs.macos.result == 'success' || needs.windows.result == 'success') }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
